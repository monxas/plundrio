name: "Build"

on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            pkg: plundrio
          - arch: aarch64
            pkg: plundrio-aarch64
          - arch: x86_64
            pkg: plundrio-docker
          - arch: aarch64
            pkg: plundrio-docker-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: DeterminateSystems/flake-checker-action@main
      - name: Build ${{ matrix.pkg }}
        run: nix build .#${{ matrix.pkg }}

  media-admission:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install local fixture tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check durable admission and publication gates
        run: go test -race ./internal/mediavalidation ./internal/download ./internal/server ./cmd/plundrio

      - name: Export and accept the immutable shared validator context
        run: python3 scripts/build-media-validator.py build --commit "$(git rev-parse HEAD)" --output-root "$RUNNER_TEMP/media-validator-contexts"
      - name: Check the default runtime keeps rootless media tooling
        run: |
          docker build --build-arg SOURCE_REVISION="$(git rev-parse HEAD)" -t plundrio:producer-check .
          docker run --rm --network none --read-only --entrypoint /bin/sh plundrio:producer-check -c 'test "$(id -u)" = 1000 && test -x /usr/bin/ffprobe && test -x /usr/local/bin/media-validate'
          docker run --rm --network none --read-only --entrypoint /app/plundrio plundrio:producer-check --version
