name: Owned media-go contract

# The homelab updater accepts a new plundrio binary only with this job's
# attestation for the exact main SHA (homelab-infra owned family media-go).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: owned-media-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media-go:
    name: owned-media-go
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install local fixture tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: N1 admission, media validation and RPC completion gates
        run: |
          mkdir -p "$RUNNER_TEMP/owned" .ci-results/media-go
          go test -race -json ./internal/mediavalidation ./internal/download ./internal/server ./cmd/plundrio > "$RUNNER_TEMP/owned/go-test.json"
      - name: Build the runtime image as the updater does (same recipe and SOURCE_REVISION)
        run: docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -t plundrio:owned-ci .
      - name: Bind tests and image binaries to this source SHA
        run: >-
          python3 ci/owned_attestation.py
          --go-json "$RUNNER_TEMP/owned/go-test.json"
          --junit .ci-results/media-go/go-test.xml
          --image plundrio:owned-ci
          --output .ci-results/media-go/attestation.json
      - uses: actions/upload-artifact@v4
        with:
          name: owned-media-go-${{ github.sha }}
          path: .ci-results/media-go/
          if-no-files-found: error
          retention-days: 14
